<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect | Portal</title>
    <!-- Tailwind CSS for modern, clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white font-bold p-2 rounded-xl">CC</div>
                <span class="text-xl font-bold tracking-tight text-slate-900">Campus Connect</span>
            </div>
            <nav class="flex space-x-2">
                <button onclick="switchTab('events')" id="btn-events" class="px-4 py-2 text-sm font-medium rounded-lg bg-indigo-50 text-indigo-600 transition">Events</button>
                <button onclick="switchTab('register')" id="btn-register" class="px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 transition">Get Ticket</button>
                <button onclick="switchTab('scanner')" id="btn-scanner" class="px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 transition">Admin Scanner</button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-6">
        
        <!-- Tab 1: Events Catalog -->
        <section id="tab-events" class="space-y-6">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Upcoming Campus Events</h1>
                <button onclick="loadEvents()" class="text-sm text-indigo-600 hover:underline font-medium">Refresh List</button>
            </div>
            <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamically injected event cards go here -->
            </div>
        </section>

        <!-- Tab 2: Register & Ticket View -->
        <section id="tab-register" class="hidden max-w-xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-slate-900">Register for Event</h2>
                <p class="text-sm text-slate-500 mt-1">Enter your User ID and the Event ID to secure your digital ticket.</p>
            </div>
            <form id="registration-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">User UUID</label>
                    <input type="text" id="reg-user-id" required placeholder="e.g., c3a5d2..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Event UUID</label>
                    <input type="text" id="reg-event-id" required placeholder="e.g., f8e2a1..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 focus:outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition shadow-sm">Generate Ticket & QR</button>
            </form>
            <div id="ticket-result" class="hidden pt-6 border-t border-slate-100 text-center space-y-4">
                <div class="p-3 bg-emerald-50 text-emerald-800 rounded-xl text-sm font-medium">Registration Successful! Ticket Generated.</div>
                <div>
                    <p class="text-xs text-slate-500 mb-2">Your Digital QR Ticket:</p>
                    <img id="qr-image" src="" alt="Ticket QR Code" class="mx-auto w-48 h-48 border border-slate-200 rounded-xl p-2 bg-white shadow-sm">
                </div>
            </div>
        </section>

        <!-- Tab 3: Admin Gate Scanner -->
        <section id="tab-scanner" class="hidden max-w-xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-slate-900">Gate Check-In Scanner</h2>
                <p class="text-sm text-slate-500 mt-1">Verify student tickets instantly at the event entrance.</p>
            </div>
            <form id="scanner-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Ticket UUID</label>
                    <input type="text" id="scan-ticket-id" required placeholder="Paste ticket UUID here..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-600 focus:outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-xl transition shadow-sm">Verify & Check-In</button>
            </form>
            <div id="scanner-result" class="hidden p-4 rounded-xl text-sm font-medium"></div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
